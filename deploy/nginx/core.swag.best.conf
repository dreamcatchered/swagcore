# /etc/nginx/sites-available/core.swag.best
# HTTP: ACME challenge + redirect на HTTPS
server {
    listen 80;
    server_name core.swag.best;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: админка + WS агентов + раздача бинарников
server {
    listen 9443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;

    server_name core.swag.best;

    ssl_certificate     /etc/letsencrypt/live/core.swag.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/core.swag.best/privkey.pem;
    client_max_body_size 512m;

    # Раздача бинарников агента (selfupdate) и install.sh
    location /download/ {
        alias /opt/swagcore/download/;
        autoindex off;

        # v0.7.0: PowerShell 5.1 на русской Windows (ACP=1251) определяет
        # кодировку ответа по Content-Type. Раньше nginx отдавал .ps1 как
        # application/octet-stream без charset, и UTF-8 текст install.ps1
        # декодировался как CP1251: в скрипт попадали "кавычки" из старших
        # байтов, и он падал с ParseException ещё до выполнения.
        # Теперь текстовые файлы отдаются как text/plain; charset=utf-8.
        charset utf-8;
        types {
            text/plain                 ps1 sh md txt yml yaml json;
            application/octet-stream   exe sha256 sig;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
